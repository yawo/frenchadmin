
services:
  postgres:
    build:
      context: ./db
    container_name: pg
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./database/sql_scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkor
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "${FALKORDBUI_PORT:-3000}:3000"
    volumes:
      - falkordb_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: graphrag-web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      RUNNING_IN_DOCKER: "true"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      FALKORDB_GRAPH_NAME: ${FALKORDB_GRAPH_NAME:-frenchadmin}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      API_URL: ${API_URL:-https://openrouter.ai/api/v1}
      API_KEY: ${API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openrouter/hunter-alpha}
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy

volumes:
  pgvector_data:
  falkordb_data:
