
services:
  postgres:
    build:
      context: ./db
    container_name: pg
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./database/sql_scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkor
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "${FALKORDBUI_PORT:-3000}:3000"
    volumes:
      - falkordb_data:/data
  

volumes:
  pgvector_data:
  falkordb_data:
